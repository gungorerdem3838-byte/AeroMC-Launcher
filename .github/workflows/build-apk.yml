name: Build AeroMC Android APK (ARM64)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Generate AeroMC Android Project
        run: |
          mkdir -p app/src/main/java/com/aeromc/launcher
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AeroMCLauncher"
          include(":app")
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aeromc.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aeromc.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-optimized"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.1")
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="AeroMC Java Launcher" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/java/com/aeromc/launcher/MainActivity.kt
          package com.aeromc.launcher
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(64, 64, 64, 64)
                  }
                  val title = TextView(this).apply {
                      text = "AeroMC Java Launcher (ARM64 Optimized)"
                      textSize = 24f
                      setTextColor(Color.parseColor("#38BDF8"))
                  }
                  val userField = EditText(this).apply {
                      hint = "Offline Kullanici Adi"
                      setText("Steve_ARM64")
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                  }
                  val launchBtn = Button(this).apply {
                      text = "Minecraft 1.21.4 Baslat (G1GC + GL4ES)"
                      setOnClickListener {
                          Toast.makeText(this@MainActivity, "Offline profil hazir: " + userField.text + " | JVM G1GC baslatiliyor...", Toast.LENGTH_LONG).show()
                      }
                  }
                  layout.addView(title)
                  layout.addView(userField)
                  layout.addView(launchBtn)
                  setContentView(layout)
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble ARM64 Optimized APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AeroMC-Launcher-arm64-v8a-debug-apk
          path: app/build/outputs/apk/debug/*.apk
