name: Build AeroMC Custom Native JVM Engine v4.0.0
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Extract AeroMC v4 Sources and Prepare Android Bionic OpenJDK 17
        run: |
          echo  | base64 -d | tar -xJf -
          bash setup_jre.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build AeroMC Custom JVM Engine APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk AeroMC-CustomJVM-v4.0.0-arm64.apk
          ls -lh AeroMC-CustomJVM-v4.0.0-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AeroMC-CustomJVM-v4.0.0-arm64-apk
          path: AeroMC-CustomJVM-v4.0.0-arm64.apk
      - name: Publish v4.0.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: AeroMC Custom Native JVM Engine v4.0.0
          files: AeroMC-CustomJVM-v4.0.0-arm64.apk
