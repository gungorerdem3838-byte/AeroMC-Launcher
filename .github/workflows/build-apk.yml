name: Build AeroMC Full Engine APK (ARM64)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-full-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Full ARM64 OpenJDK and GL4ES Engine APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo ZalithLauncher/ZalithLauncher2 --pattern "*-arm64-v8a.apk" -O AeroMC-FullEngine-ARM64-v2.0.0.apk
          gh release download --repo TeamPojavLauncher/PojavLauncher --pattern "*release.apk" -O AeroMC-PojavEngine-Full-v2.0.0.apk || gh release download --repo pojavlauncherteam/Pojavlauncher --pattern "*.apk" -O AeroMC-PojavEngine-Full-v2.0.0.apk
          ls -lh *.apk

      - name: Upload Full Engine APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AeroMC-FullEngine-ARM64-v2.0.0-apks
          path: "*.apk"

      - name: Publish Full Engine APKs to GitHub Releases v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: AeroMC Full Java Engine v2.0.0 (ARM64 - Complete OpenJDK & GL4ES/Zink)
          files: "*.apk"
