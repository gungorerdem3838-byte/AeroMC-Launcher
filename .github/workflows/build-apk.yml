          cp app/build/outputs/apk/debug/app-debug.apk AeroMC-Launcher-v3.0.0-arm64-v8a.apk
          ls -lh AeroMC-Launcher-v3.0.0-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
